[project]
name = "bnsf-fm"
version = "0.1.0"
description = "Facilities intelligence platform over Corrigo Enterprise data — work order accountability, asset registry, routing and parts inventory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
ai = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.scripts]
bnsf-fm = "bnsf_fm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bnsf_fm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
